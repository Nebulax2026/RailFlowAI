services:
  - type: web
    name: railflow-ai-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DATABASE_URL
        sync: false
      - key: RAILFLOW_CORS_ORIGINS
        sync: false
      - key: RAILFLOW_HOSTED
        value: "true"
      - key: RAILFLOW_DEMO_CONTROLS_ENABLED
        value: "false"
