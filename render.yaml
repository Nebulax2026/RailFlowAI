services:
  - type: web
    name: railflowai
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: RAILFLOW_ALLOWED_HOSTS
        value: railflowai.onrender.com,localhost,127.0.0.1
      - key: RAILFLOW_CORS_ORIGINS
        value: https://railflowai.onrender.com
